[package]
name = "neo"
version = "0.2.3"
entry = "examples/hello.neo"

[tool.neo]
python-tests = "tests"
doc-tests = ["docs/getting-started.md", "docs/language-v01.md"]
integration = "tests/integration.neo.toml"
reference-integration = "tests/integration.py"

