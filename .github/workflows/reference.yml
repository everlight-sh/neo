name: Verify Python reference
on: workflow_dispatch
jobs:
  native-linux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y clang lld python3 binutils openssl gzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - name: Install TSX example build dependencies
        run: cd examples/jsx-ssr && bun install --frozen-lockfile
      - name: Build the reference seed for differential verification
        run: python3 compiler/bootstrap.py -o .neo-build/reference
      - name: Self-build with only native tools
        run: |
          mkdir -p .neo-build/toolchain
          for tool in clang ld ld.lld mkdir; do ln -s "$(command -v "$tool")" ".neo-build/toolchain/$tool"; done
          env -i PATH="$PWD/.neo-build/toolchain" NEO_RUNTIME=/missing-seed.o \
            ./compiler/bootstrap.sh --seed "$PWD/.neo-build/reference/neoc" -o .neo-build/bin
      - name: Build through the native driver
        run: NEO_RUNTIME=/missing-seed.o ./neo build examples/hello.neo -o .neo-build/ci-hello && ./.neo-build/ci-hello
      - name: Compare native project tests with the reference runner
        run: python3 compiler/tests/project_differential.py .neo-build/bin/neoc
      - name: Compare native formatting with the reference formatter
        run: python3 compiler/tests/formatter_differential.py .neo-build/bin/neoc
      - name: Compare native project initialization with the reference
        run: python3 compiler/tests/init_differential.py .neo-build/bin/neoc
      - name: Compare native package commands with the reference
        run: python3 compiler/tests/package_commands_differential.py .neo-build/bin/neoc
      - name: Compare offline native package imports with the reference
        run: python3 compiler/tests/package_import_differential.py .neo-build/bin/neoc
      - name: Compare the native editor, graph and release tools with Python
        run: python3 compiler/tests/tooling_differential.py .neo-build/bin/neoc
      - name: Compare prepared libraries, build reports and experimental proofs
        run: python3 compiler/tests/build_options_differential.py .neo-build/bin/neoc
      - name: Run the repository's native cases without Python
        run: env -i PATH="$PWD/.neo-build/toolchain" ./neo test --unit-only
      - name: Run native integration cases without Python
        run: env -i PATH="$PWD/.neo-build/toolchain" ./neo test tests/integration.neo.toml
      - name: Python reference compiler and application verification suite
        run: ./neoc.sh test
      - name: Empty-root runtime audit
        run: ./neo build examples/http.neo -o .kernel-build/ci-http && sudo python3 tests/freestanding_linux_smoke.py --binary .kernel-build/ci-http
      - name: Reproducible compiler bundle
        run: ./neo release -o .kernel-build/release-a.tar.gz && ./neo release -o .kernel-build/release-b.tar.gz && cmp .kernel-build/release-a.tar.gz .kernel-build/release-b.tar.gz
      - name: Empty-root language, crypto and TLS
        run: |
          ./neo build tests/fixtures/language_kernel.neo -o .kernel-build/ci-kernel
          ./neo build tests/fixtures/language_crypto.neo -o .kernel-build/ci-crypto
          ./neo build tests/fixtures/language_tls.neo -o .kernel-build/ci-tls
          sudo python3 tests/language_freestanding.py --kernel .kernel-build/ci-kernel --crypto .kernel-build/ci-crypto --tls .kernel-build/ci-tls
