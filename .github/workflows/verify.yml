name: Verify Neo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the published native seed
        shell: bash
        run: |
          if [[ $(uname -s) == Darwin ]]; then
            echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
          fi
          NEO_HOME="$RUNNER_TEMP/neo-seed" sh install.sh --version 0.2.0
      - name: Bootstrap and test with native tools
        shell: bash
        run: |
          tools="$RUNNER_TEMP/neo-tools"
          mkdir -p "$tools"
          for name in clang ld ld.lld mkdir gzip uname readlink; do
            if tool=$(command -v "$name"); then ln -s "$tool" "$tools/$name"; fi
          done
          native() { env -i PATH="$tools" HOME="$HOME" SDKROOT="${SDKROOT:-}" "$@"; }
          native ./compiler/bootstrap.sh --seed "$RUNNER_TEMP/neo-seed/bin/neo"
          native ./neo test --unit-only
          native ./neo test tests/integration.neo.toml
          native ./neo release -o "$RUNNER_TEMP/neo-release-a.tar.gz"
          native ./neo release -o "$RUNNER_TEMP/neo-release-b.tar.gz"
          cmp "$RUNNER_TEMP/neo-release-a.tar.gz" "$RUNNER_TEMP/neo-release-b.tar.gz"
