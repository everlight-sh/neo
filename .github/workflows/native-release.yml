name: Native release bundles
on:
  push:
    branches: ['release/native-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the published native seed
        shell: bash
        run: |
          if [[ $(uname -s) == Darwin ]]; then
            export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
            echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          fi
          NEO_HOME="$RUNNER_TEMP/neo-seed" sh install.sh --version 0.2.0
      - name: Build and package without Python
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tools="$RUNNER_TEMP/neo-tools"
          mkdir -p "$tools" dist
          for name in clang ld ld.lld mkdir gzip uname readlink; do
            if tool=$(command -v "$name"); then ln -s "$tool" "$tools/$name"; fi
          done
          version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' neo.toml)
          epoch=$(git show -s --format=%ct HEAD)
          native() { env -i PATH="$tools" HOME="$HOME" SDKROOT="${SDKROOT:-}" SOURCE_DATE_EPOCH="$epoch" "$@"; }
          native ./compiler/bootstrap.sh --seed "$RUNNER_TEMP/neo-seed/bin/neo"
          native ./neo release -o "dist/neo-$version-$PLATFORM.tar.gz"
          native ./neo release -o "$RUNNER_TEMP/neo-repeat.tar.gz"
          cmp "dist/neo-$version-$PLATFORM.tar.gz" "$RUNNER_TEMP/neo-repeat.tar.gz"
          ./scripts/verify-native-release.sh "$PWD/dist/neo-$version-$PLATFORM.tar.gz" "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: neo-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
