# Native cases ported from the Python network tests (see tests/porting/README.md).
[tool.neo]
test-globs = []

[[test]]
name = "sha512-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/language_sha512.neo", "vectors/sha512_language/sha512.in", "SHA-512/384 and HMAC (FIPS 180-4, RFC 4231, hashlib)"]
stdout = "SHA-512/384 and HMAC (FIPS 180-4, RFC 4231, hashlib): 155 cases OK\n"
timeout = 300

[[test]]
name = "agent-codecs-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/agent_codecs.neo", "vectors/agent_codecs/codecs.in", "decimal/binary64 conversion and strict Base64/Base64url"]
stdout = "decimal/binary64 conversion and strict Base64/Base64url: 750 cases OK\n"
timeout = 300

[[test]]
name = "aes-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/language_aes.neo", "vectors/aes_language/aes.in", "AES-128 FIPS-197/GCM vectors and Go-oracle GCM, portable and fast paths"]
stdout = "AES-128 FIPS-197/GCM vectors and Go-oracle GCM, portable and fast paths: 479 cases OK\n"
timeout = 300

[[test]]
name = "crypto-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/language_crypto.neo", "vectors/crypto_language/crypto.in", "SHA-1/SHA-256/HMAC/HKDF, ChaCha20-Poly1305, X25519 and RSA vs OpenSSL"]
stdout = "SHA-1/SHA-256/HMAC/HKDF, ChaCha20-Poly1305, X25519 and RSA vs OpenSSL: 179 cases OK\n"
timeout = 300

[[test]]
name = "crypto-rfc-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/crypto_rfc.neo", "vectors/test_crypto/rfc.in", "HMAC, RFC 5869 HKDF and RFC 8439 ChaCha20-Poly1305"]
stdout = "HMAC, RFC 5869 HKDF and RFC 8439 ChaCha20-Poly1305: 14 cases OK\n"
timeout = 120

[[test]]
name = "siphash-vectors"
file = "fixtures/siphash_vectors.neo"
stdout-file = "vectors/test_hash/siphash.out"

[[test]]
name = "p256-montgomery"
file = "drivers/p256_language.neo"
stdout = "P-256 field/order Montgomery add/sub/multiply/inverse vs Python integers: 346 cases OK\n"
timeout = 300

[[test]]
name = "p256-ecdh-ecdsa"
file = "drivers/network_vectors.neo"
args = ["fixtures/language_p256.neo", "vectors/p256_protocols/p256.in", "P-256 ECDH/ECDSA vs RFC 6979 and Go"]
stdout = "P-256 ECDH/ECDSA vs RFC 6979 and Go: 95 cases OK\n"
timeout = 300

[[test]]
name = "p384-field-ecdsa"
file = "drivers/p384_language.neo"
stdout = "P-384 field/order Montgomery records: 1 cases OK\nP-384/P-256 public keys and ECDSA vs Go: 3 cases OK\n"
timeout = 600

[[test]]
name = "deflate-vectors"
file = "drivers/network_vectors.neo"
args = ["fixtures/deflate_language.neo", "vectors/deflate_language/deflate.in", "raw DEFLATE, zlib, gzip and Content-Encoding vs Python zlib"]
stdout = "raw DEFLATE, zlib, gzip and Content-Encoding vs Python zlib: 145 cases OK\n"
timeout = 600

# http_data.py: the page data, checked once with Python's HTMLParser (one
