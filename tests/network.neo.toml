# http_limits.py: refusals, 100-continue, timeouts, the connection limit,
# client addresses and worker restarts on io_uring, epoll and poll.
[[test]]
name = "http-limits"
file = "drivers/http_limits.neo"
stdout = """
== io_uring
  400, 413 and 431 with Connection: close, including mid-upload and pipelined; Expect: 100-continue: PASS
  header (408), body and keep-alive idle timeouts: PASS
  NEO_HTTP_CONNECTIONS limit answers 503: PASS
  web_peer, web_client_ip and web_client_proto without trusted proxies: PASS
  web_peer, web_client_ip and web_client_proto behind NEO_TRUSTED_PROXIES: PASS
  crashed workers are replaced and the accept turn moves on: PASS
== epoll
  400, 413 and 431 with Connection: close, including mid-upload and pipelined; Expect: 100-continue: PASS
  header (408), body and keep-alive idle timeouts: PASS
  NEO_HTTP_CONNECTIONS limit answers 503: PASS
  web_peer, web_client_ip and web_client_proto without trusted proxies: PASS
  web_peer, web_client_ip and web_client_proto behind NEO_TRUSTED_PROXIES: PASS
  crashed workers are replaced and the accept turn moves on: PASS
== poll
  400, 413 and 431 with Connection: close, including mid-upload and pipelined; Expect: 100-continue: PASS
  header (408), body and keep-alive idle timeouts: PASS
  NEO_HTTP_CONNECTIONS limit answers 503: PASS
  web_peer, web_client_ip and web_client_proto without trusted proxies: PASS
  web_peer, web_client_ip and web_client_proto behind NEO_TRUSTED_PROXIES: PASS
  crashed workers are replaced and the accept turn moves on: PASS
"""
timeout = 300

