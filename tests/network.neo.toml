# x509_web_language.py: every generated certificate parses with the expected
# signature mode, key type and size (checked against openssl x509 -text).
[[test]]
name = "x509-web-bundle"
file = "fixtures/x509_bundle.neo"
stdin-file = "vectors/x509_web_language/bundle.pem"
stdout-file = "vectors/x509_web_language/bundle.out"

# network_language.py: DNS and HTTP/1.1 clients against forked UDP/TCP peers.
[[test]]
name = "network-language"
file = "drivers/network_language.neo"
stdout = "PASS DNS: UDP, compressed CNAME, ID/question validation, pointer cycles, fragmented TCP fallback, truncation and monotonic deadlines\nPASS HTTP: seven methods, HEAD, fixed/chunked/EOF framing, 1xx, malicious framing, early chunks and 4 MiB streamed through a bounded buffer\n"
timeout = 300

# async_tasks.py: a forked holder keeps the file lock for 250 ms.
[[test]]
name = "async-tasks"
file = "drivers/async_tasks.neo"
stdout = "PASS nested tasks, independent timer progress during a contended file lock, and normal resource cleanup\n"
timeout = 120

# http_async.py: deferred fragments, fast requests and graceful shutdown.
[[test]]
name = "http-async"
file = "drivers/http_async.neo"
stdout = "PASS 1 workers grace 150\nPASS 1 workers grace 2000\nPASS 2 workers grace 150\nPASS 2 workers grace 2000\nPASS 4 workers grace 150\nPASS 4 workers grace 2000\n"
timeout = 300

# prepared_frames.py: the async_frames.neo server under backpressure,
# eviction, disconnects and shutdown; prepared_frames.neo checks the frame
# cache itself (keys, bounded storage, eviction, fork ownership).
[[test]]
name = "prepared-frames"
file = "drivers/prepared_frames.neo"
stdout = "PASS 1 workers: persistent state/reset, prepared fast writes, 4 backpressured 4 MiB bodies across cache eviction, responsive fast requests and disconnect/shutdown cleanup\nPASS 2 workers: persistent state/reset, prepared fast writes, 4 backpressured 4 MiB bodies across cache eviction, responsive fast requests and disconnect/shutdown cleanup\n"
timeout = 300

[[test]]
name = "prepared-frame-cache"
file = "fixtures/prepared_frames.neo"
stdout = "42\n"
timeout = 60

# async_pressure.py: streaming backpressure, admission and shutdown.
[[test]]
name = "async-pressure"
file = "drivers/async_pressure.neo"
stdout = "PASS root I/O-to-stream handoff, partial admission rollback, and root failure before headers\nPASS 8 backpressured 8 MiB streams do not stall fast requests\nPASS exact 256-task admission bound and cancellation of every admitted task\nPASS slow-reader deadlines release task and result memory\nPASS graceful shutdown cancels held socket/timer continuations by deadline\n"
timeout = 300

# http_handoff.py: 1024 short-lived binary echoes from 32 concurrent clients.
[[test]]
name = "http-handoff"
file = "drivers/http_handoff.neo"
stdout = "PASS 2 native workers: 1024 short-lived concurrent connections, binary echoes, no retries\nPASS 4 native workers: 1024 short-lived concurrent connections, binary echoes, no retries\n"
timeout = 300

# listener_release.py: a stopped server frees its port at once.
[[test]]
name = "listener-release"
file = "drivers/listener_release.neo"
stdout = "PASS io_uring #0: port bindable within 50 ms; restart serves\nPASS io_uring #1: port bindable within 50 ms; restart serves\nPASS io_uring #2: port bindable within 50 ms; restart serves\nPASS io_uring, 2 workers #0: port bindable within 50 ms; restart serves\nPASS io_uring, 2 workers #1: port bindable within 50 ms; restart serves\nPASS io_uring, 2 workers #2: port bindable within 50 ms; restart serves\nPASS epoll #0: port bindable within 50 ms; restart serves\nPASS epoll #1: port bindable within 50 ms; restart serves\nPASS epoll #2: port bindable within 50 ms; restart serves\n"
timeout = 300

# tls_language.py, TLS half: Go and openssl s_server peers.
[[test]]
name = "tls-language"
file = "drivers/tls_language.neo"
stdout = "PASS TLS 1.3: RSA/ECDSA and mixed issuer chains, independent encrypted peer, byte fragmentation, tickets, close-notify, hostname/chain rejection, corrupt tags, truncation, deadlines and KeyUpdate; a TLS 1.2-only peer over TLS 1.2\n"
timeout = 300

# http_keepalive.py: keep-alive HttpClient against the Go peer, TCP and TLS 1.3.
[[test]]
name = "http-keepalive"
file = "drivers/http_keepalive.neo"
stdout = "PASS keep-alive over TCP: 12 requests on 5 connections; reuse, server close, silent close retried for GET and not for POST, body limit, chunked body\nPASS keep-alive over TLS 1.3: 12 requests on 5 connections; reuse, server close, silent close retried for GET and not for POST, body limit, chunked body\n"
timeout = 300

# http_large_body.py: large Content-Length bodies over TCP, TLS 1.3 and TLS 1.2.
[[test]]
name = "http-large-body"
file = "drivers/http_large_body.neo"
stdout = "PASS large bodies over TCP: 13 requests, 1 B to 1 MiB, small writes, early close, excess bytes\nPASS large bodies over TLS 1.3 (client order): 13 requests, 1 B to 1 MiB, small writes, early close, excess bytes\nPASS large bodies over TLS 1.3 (server order): 13 requests, 1 B to 1 MiB, small writes, early close, excess bytes\nPASS large bodies over TLS 1.2: 13 requests, 1 B to 1 MiB, small writes, early close, excess bytes\n"
timeout = 300

# agent_network.py: socket cancellation, and SSE over TCP and TLS 1.3.
[[test]]
name = "agent-network"
file = "drivers/agent_network.neo"
stdout = "PASS first-read preservation and cross-process cancellation of stalled socket\nPASS authorization/custom headers, bounded HTTP chunk decoding and fragmented SSE over TCP and authenticated TLS 1.3\n"
timeout = 300

# async_protocols.py: concurrent TLS, HTTP and DNS tasks against delayed peers.
[[test]]
name = "async-protocols"
file = "drivers/async_protocols.neo"
stdout = "PASS verified TLS 1.3 + HTTP + DNS suspended call stacks, await deadlines and resource cleanup\n"
timeout = 300

# tls_resume_language.py: TLS 1.3 PSK resumption against OpenSSL and Go.
[[test]]
name = "tls-resume"
file = "drivers/tls_resume_language.neo"
stdout = """PASS OpenSSL, default tickets: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL, three tickets per connection: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL, P-256 only: HelloRetryRequest with a PSK: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL, stateless cookie: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL, AES-128-GCM: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL, ChaCha20-Poly1305: resumed; tampered, expired fall back; wrong PSK rejected
PASS OpenSSL without tickets: every connection is a full handshake
PASS HttpClient against OpenSSL: resumptions 0, 1, 2, 3, 3, 4 (the 5th request follows http_client_close)
PASS Go net/http: resumed; tampered, expired fall back; wrong PSK rejected
PASS HttpClient against Go net/http (HTTP/1.1): resumptions 0, 1, 2, 3, 3, 4 (the 5th request follows http_client_close)
PASS HttpClient against Go net/http (h2): resumptions 0, 1, 2, 3, 3, 4 (the 5th request follows http_client_close)
"""
timeout = 600

