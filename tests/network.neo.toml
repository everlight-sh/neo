stdout = ""

[[test]]
name = "http-data-quote-name"
file = "fixtures/http_data.neo"
args = ["2"]
exit = 1
stdout = ""

[[test]]
name = "http-data-long-name"
file = "fixtures/http_data.neo"
args = ["3"]
exit = 1
stdout = ""

