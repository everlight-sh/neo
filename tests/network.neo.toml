# http2_language.py: Go net/http (tests/http2_server.go), openssl s_server
# without ALPN, and the scripted HTTP/2 server (network_peer.go -mode h2script).
[[test]]
name = "http2-language"
file = "drivers/http2_language.neo"
stdout = """
PASS h2: 12 requests on one connection (1 MiB, 101 Huffman/dynamic-table headers, CONTINUATION, streamed body, 3 MB upload, HEAD, 404)
PASS h2 GOAWAY after Connection: close, next request reconnects
PASS h2 with TLS resumption: resumptions 0, 1, 2, then 2 after http_client_close
PASS fallback to HTTP/1.1 (server ALPN http/1.1 only): 7 keep-alive requests, same headers
PASS fallback to HTTP/1.1 (server without ALPN)
PASS PING, SETTINGS, padding, priority, CONTINUATION, trailers, 103, size updates
PASS RST_STREAM fails the request and keeps the connection
PASS REFUSED_STREAM retries a POST
PASS GOAWAY before the stream retries on a new connection
PASS GOAWAY after the stream: the next request reconnects
PASS connection error (DATA on stream 0), then a new connection
PASS malformed response field fails the stream only
"""
timeout = 600
