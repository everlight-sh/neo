# Native cases ported from the Python runtime tests (see tests/porting/README.md).
[tool.neo]
test-globs = []

# kernel_runtime_smoke.py: freestanding runtime primitives at 1 and 4 workers
# (n=8192), and a static-binary audit of the three fixtures.
[[test]]
name = "kernel-runtime-1-worker"
file = "fixtures/kernel_runtime.neo"
args = ["8192"]
env.NEO_THREADS = "1"
stdout = "1017485\n"
timeout = 15

[[test]]
name = "kernel-runtime-4-workers"
file = "fixtures/kernel_runtime.neo"
args = ["8192"]
env.NEO_THREADS = "4"
stdout = "1017485\n"
timeout = 15

[[test]]
name = "parallel-runtime-1-worker"
file = "fixtures/parallel_runtime.neo"
args = ["8192"]
env.NEO_THREADS = "1"
stdout = "100659200\n"
timeout = 15

[[test]]
name = "parallel-runtime-4-workers"
file = "fixtures/parallel_runtime.neo"
args = ["8192"]
env.NEO_THREADS = "4"
stdout = "100659200\n"
timeout = 15

[[test]]
name = "memory-blocks-1-worker"
file = "fixtures/memory_blocks.neo"
args = ["8192"]
env.NEO_THREADS = "1"
stdout = "0\n"
timeout = 15

[[test]]
name = "memory-blocks-4-workers"
file = "fixtures/memory_blocks.neo"
args = ["8192"]
env.NEO_THREADS = "4"
stdout = "0\n"
timeout = 15

[[test]]
name = "kernel-runtime-static-audit"
file = "drivers/kernel_runtime_smoke.neo"
stdout = "kernel runtime audit OK\n"
timeout = 120

