# usability_smoke.py: the JSON differential corpus against Python's json
# verdicts (the replies were checked against Python once and frozen), and the
# example applications.
[[test]]
name = "usability-json-differential"
file = "fixtures/json_probe.neo"
stdin-file = "vectors/usability_smoke/json_probe.in"
stdout-file = "vectors/usability_smoke/json_probe.out"
timeout = 90

[[test]]
name = "usability-applications"
file = "drivers/usability_smoke.neo"
stdout = "PASS JSON CLI: schema, stable sort/filter, Unicode, malformed data and recoverable file errors\nPASS file append/read/errors, environment/argv, embedded-NUL rejection, clocks and sleep\nPASS notes: CRUD, escaped SSR, 30 concurrent writes, SIGKILL/restart, torn-tail repair, corruption and storage failure\nPASS webhook: durable enqueue, concurrent deduplication, retries, deadlines, failure limits and restart recovery\nusability OK\n"
timeout = 300

# ssr_smoke.py: examples/ssr.neo serves exact pages, routes, rejects bad
# requests and pipelines; its escape proves buf[k] in bounds from the sum of
# esc_width (at most 6 per byte).
[[test]]
name = "ssr-exact-pages-and-pipelining"
file = "drivers/ssr_smoke.neo"
stdout = "SSR OK\n"
timeout = 300

# jsx_ssr_smoke.py: the TSX->Neo server's pages equal React's
# renderToStaticMarkup (frozen digests) at 1 and 4 workers.
[[test]]
name = "jsx-ssr-react-identical-pages"
file = "drivers/jsx_ssr_smoke.neo"
stdout = "JSX SSR OK\n"
timeout = 600

# Sum bounds: a sum of span terms, each between c and d, lies between c*span
# and d*span when span >= 0.
[[test]]
name = "sum-bounds-escape-width"
file = "fixtures/sum_bounds/escape_width.neo"
check = true

[[test]]
name = "sum-bounds-too-tight"
file = "fixtures/sum_bounds/too_tight.neo"
reject = true
exit = 1
diagnostic = "postcondition"

[[test]]
name = "sum-bounds-lower-too-tight"
file = "fixtures/sum_bounds/lower_too_tight.neo"
reject = true
exit = 1
diagnostic = "postcondition"

[[test]]
name = "sum-bounds-unknown-span"
file = "fixtures/sum_bounds/unknown_span.neo"
reject = true
exit = 1
diagnostic = "postcondition"

# test_modules.py (Python neoc.modules) as native module fixtures.
[[test]]
name = "modules-aliases-and-imported-generics"
file = "fixtures/test_modules/aliases.neo"
stdout = "42\n"

[[test]]
name = "modules-private-declarations"
file = "fixtures/test_modules/private.neo"
reject = true
exit = 1
diagnostic = "private function a::secret"

[[test]]
name = "modules-ambiguous-imports"
file = "fixtures/test_modules/ambiguous.neo"
reject = true
exit = 1
diagnostic = "ambiguous import value"

[[test]]
name = "modules-sealed-record-use"
file = "fixtures/test_modules/sealed_use.neo"
stdout = "7\n"

[[test]]
name = "modules-sealed-record-construction"
file = "fixtures/test_modules/sealed_construct.neo"
reject = true
exit = 1
diagnostic = "sealed type Valid can only be constructed in its declaring module"

[[test]]
name = "modules-sealed-record-update"
file = "fixtures/test_modules/sealed_update.neo"
reject = true
exit = 1
diagnostic = "sealed type Valid can only be updated in its declaring module"

[[test]]
name = "modules-transitive-diamond"
file = "fixtures/test_modules/diamond.neo"
stdout = "4\n"

[[test]]
name = "modules-missing-import"
file = "fixtures/test_modules/missing_import.neo"
reject = true
exit = 1
diagnostic = "cannot read"

[[test]]
name = "modules-cyclic-import"
file = "fixtures/test_modules/cycle.neo"
reject = true
exit = 1
diagnostic = "cyclic import"

[[test]]
name = "modules-imported-main"
file = "fixtures/test_modules/main_import.neo"
reject = true
exit = 1
diagnostic = "imported modules cannot declare main"

[[test]]
name = "modules-recursive-value-type"
file = "fixtures/test_modules/recursive_type.neo"
reject = true
exit = 1
diagnostic = "is not finite"

