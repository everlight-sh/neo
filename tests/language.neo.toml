# Native cases ported from the Python language tests (see tests/porting/README.md).
[tool.neo]
test-globs = []

# Sweeps: drivers/language_sweep.neo builds one fixture (and audits the
# binary) and checks every run of a vector file; see tests/support/language.neo
# for the format. Vector files carry their provenance in # comment lines.

# bit_counts.py: count_trailing_zeros of zero, sign bits, every power of two
# and random words, 1 and 4 workers.
[[test]]
name = "bit-counts"
file = "drivers/language_sweep.neo"
args = ["fixtures/bit_counts.neo"]
stdin-file = "vectors/bit_counts/runs.in"
stdout = "bit_counts.neo: 422 runs OK\n"
timeout = 300

