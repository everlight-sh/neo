# Reference unit tests (test_*.py) tested the Python compiler; these fixtures
# keep the behaviours worth keeping as native check, reject and run cases.

# test_language_types.py: generics, error binding, shapes and unit payloads run;
# match exhaustiveness, arity, duplicates, privacy, payload types and recursive
# types are rejected.
[[test]]
name = "language-types-values"
file = "fixtures/test_language_types/values.neo"
args = ["3"]
stdout = "42 4 -3 5 42\n"

[[test]]
name = "language-types-non-exhaustive"
file = "fixtures/test_language_types/non_exhaustive.neo"
reject = true
exit = 1
diagnostic = "non-exhaustive match"

[[test]]
name = "language-types-payload-arity"
file = "fixtures/test_language_types/payload_arity.neo"
reject = true
exit = 1
diagnostic = "match payload arity mismatch"

[[test]]
name = "language-types-duplicate-arm"
file = "fixtures/test_language_types/duplicate_arm.neo"
reject = true
exit = 1
diagnostic = "duplicate match arm"

[[test]]
name = "language-types-unreachable-arm"
file = "fixtures/test_language_types/unreachable_arm.neo"
reject = true
exit = 1
diagnostic = "unreachable arm after wildcard"

[[test]]
name = "language-types-private-tag"
file = "fixtures/test_language_types/private_tag.neo"
reject = true
exit = 1
diagnostic = "enum storage is private; use exhaustive match"

[[test]]
name = "language-types-payload-type"
file = "fixtures/test_language_types/payload_type.neo"
reject = true
exit = 1
diagnostic = "has type Arr u8"

[[test]]
name = "language-types-recursive-type"
file = "fixtures/test_language_types/recursive_type.neo"
reject = true
exit = 1
